name: Android Debug Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository currently has no package-lock.json.
      # Keep npm caching disabled until a lockfile is committed.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # npm install works without a pre-existing lockfile.
      # Commit a reviewed package-lock.json later and switch to npm ci
      # for fully reproducible dependency resolution.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run Lint
        run: npm run lint:rules

      - name: Run TypeScript Checks
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write Android Debug Build Summary
        if: success()
        run: |
          APK_SIZE=$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          {
            echo "### BOARDORA — Android Debug APK"
            echo "- **Application ID**: `com.boardora.teninone`"
            echo "- **Build Variant**: `debug`"
            echo "- **Artifact**: `boardora-debug-apk` (`${APK_SIZE}`)"
            echo "- **Checks**: Rules Lint, TypeScript, Vitest, Vite Build, Gradle Debug"
          } >> "$GITHUB_STEP_SUMMARY"
