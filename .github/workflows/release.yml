name: Android Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run Lint
        run: npm run lint:rules

      - name: Run TypeScript Checks
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Validate Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/boardora-release.jks"

      - name: Build Signed Release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/boardora-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove Temporary Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/boardora-release.jks"

      - name: Verify Signed Artifacts
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boardora-signed-release-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Write Release Summary
        if: success()
        run: |
          APK_SIZE=$(du -h android/app/build/outputs/apk/release/app-release.apk | cut -f1)
          AAB_SIZE=$(du -h android/app/build/outputs/bundle/release/app-release.aab | cut -f1)
          {
            echo "### BOARDORA — Signed Release (${{ github.ref_name }})"
            echo "- **Signed APK**: \`app-release.apk\` (\`${APK_SIZE}\`)"
            echo "- **Signed AAB**: \`app-release.aab\` (\`${AAB_SIZE}\`)"
            echo "- **Quality Gates**: Rules Lint, TypeScript, Vitest, Vite Build passed"
          } >> "$GITHUB_STEP_SUMMARY"
