    <polygon points="6,24 42,42 42,78 6,60" fill="#EAE0CE" stroke="#C9BCA4" stroke-width="1"/>
    <polygon points="78,24 42,42 42,78 78,60" fill="url(#whiteDieSide)" stroke="#B8AA90" stroke-width="1"/>
    <ellipse cx="42" cy="24" rx="4.8" ry="2.8" fill="#08172F"/>
    <circle cx="18" cy="40" r="3.2" fill="#08172F"/>
    <circle cx="30" cy="58" r="3.2" fill="#08172F"/>
    <circle cx="53" cy="59" r="3.2" fill="#08172F"/>
    <circle cx="67" cy="41" r="3.2" fill="#08172F"/>
  </g>

  <!-- Four Glossy Ludo Pawns in Official Player Colors -->
  <!-- Classic Red Pawn -->
  <g transform="translate(122 196)">
    <ellipse cx="22" cy="64" rx="16" ry="5" fill="#000" fill-opacity="0.48"/>
    <path d="M8 60C8 55 14 52 22 52C30 52 36 55 36 60C36 63 30 65 22 65C14 65 8 63 8 60Z" fill="url(#redPawn)"/>
