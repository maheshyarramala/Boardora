    <polygon points="100,248 320,350 320,366 100,264" fill="#2A1810" stroke="#9B712D" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="540,248 320,350 320,366 540,264" fill="#1D100A" stroke="#9B712D" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Board Top -->
    <polygon points="100,248 320,164 540,248 320,350" fill="url(#walnutDeck)" stroke="#D6AD55" stroke-width="2.2"/>
    <!-- Inlaid Chess Squares -->
    <g opacity="0.92">
      <polygon points="196,246 258,219 320,246 258,274" fill="#F4EBDD"/>
      <polygon points="320,246 382,219 444,246 382,274" fill="#0D2144"/>
      <polygon points="258,219 320,192 382,219 320,246" fill="#0D2144"/>
      <polygon points="258,274 320,246 382,274 320,302" fill="#0D2144"/>
      <polygon points="138,246 196,220 258,246 196,274" fill="#0D2144"/>
      <polygon points="382,246 444,220 502,246 444,274" fill="#F4EBDD"/>
      <polygon points="258,274 320,302 258,330 196,302" fill="#F4EBDD"/>
      <polygon points="382,274 444,302 382,330 320,302" fill="#F4EBDD"/>
    </g>
    <polygon points="134,248 320,176 506,248 320,334" stroke="#D6AD55" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
