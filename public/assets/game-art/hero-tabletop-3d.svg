  <g transform="translate(466 196)">
    <ellipse cx="22" cy="64" rx="16" ry="5" fill="#000" fill-opacity="0.48"/>
    <path d="M8 60C8 55 14 52 22 52C30 52 36 55 36 60C36 63 30 65 22 65C14 65 8 63 8 60Z" fill="url(#greenPawn)"/>
    <path d="M12 56L17 31H27L32 56H12Z" fill="url(#greenPawn)"/>
    <circle cx="22" cy="22" r="10.5" fill="url(#greenPawn)"/>
    <ellipse cx="18.5" cy="18" rx="3.8" ry="2.1" transform="rotate(-24 18.5 18)" fill="#FFFFFF" fill-opacity="0.72"/>
  </g>

  <!-- Royal Blue Pawn -->
  <g transform="translate(492 238) scale(0.92)">
    <ellipse cx="22" cy="64" rx="16" ry="5" fill="#000" fill-opacity="0.48"/>
    <path d="M8 60C8 55 14 52 22 52C30 52 36 55 36 60C36 63 30 65 22 65C14 65 8 63 8 60Z" fill="url(#bluePawn)"/>
    <path d="M12 56L17 31H27L32 56H12Z" fill="url(#bluePawn)"/>
    <circle cx="22" cy="22" r="10.5" fill="url(#bluePawn)"/>
    <ellipse cx="18.5" cy="18" rx="3.8" ry="2.1" transform="rotate(-24 18.5 18)" fill="#FFFFFF" fill-opacity="0.72"/>
  </g>

  <!-- Royal Gold Pawn -->
  <g transform="translate(268 278) scale(0.9)">
    <ellipse cx="22" cy="64" rx="16" ry="5" fill="#000" fill-opacity="0.48"/>
    <path d="M8 60C8 55 14 52 22 52C30 52 36 55 36 60C36 63 30 65 22 65C14 65 8 63 8 60Z" fill="url(#goldPawn)"/>
