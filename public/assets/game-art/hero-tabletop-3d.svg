    <ellipse cx="42" cy="134" rx="26" ry="8" fill="#9B712D" stroke="#F6DF96" stroke-width="1.2"/>
    <path d="M22 130C24 102 30 74 32 54H52C54 74 60 102 62 130H22Z" fill="url(#goldPiece)"/>
    <ellipse cx="42" cy="54" rx="14" ry="5" fill="#F6DF96"/>
    <path d="M28 48C26 36 32 28 42 28C52 28 58 36 56 48H28Z" fill="url(#goldPiece)"/>
    <path d="M39 10H45V28H39V10ZM33 16H51V21H33V16Z" fill="#FFF0BC"/>
  </g>

  <!-- Golden Royal Knight Hero Piece (Center) -->
  <g transform="translate(274 72)">
    <ellipse cx="52" cy="182" rx="36" ry="12" fill="#000000" fill-opacity="0.52"/>
    <ellipse cx="52" cy="175" rx="34" ry="10" fill="#9B712D" stroke="#F6DF96" stroke-width="1.4"/>
    <ellipse cx="52" cy="166" rx="28" ry="8" fill="url(#goldPiece)"/>
    <path d="M26 164C26 134 38 110 52 96C34 92 22 79 20 64C18 48 30 34 48 28L54 14L68 24C84 26 98 42 101 66C104 92 92 122 80 140C86 148 90 156 90 164H26Z" fill="url(#goldPiece)" stroke="#FFF0BC" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M68 36C82 44 92 60 91 84C90 98 83 112 75 122" stroke="#5D3E11" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55"/>
    <circle cx="46" cy="48" r="3.4" fill="#08172F"/>
