    <polygon points="42,6 78,24 42,42 6,24" fill="url(#whiteDieTop)" stroke="#E5DAC5" stroke-width="1.2"/>
    <polygon points="6,24 42,42 42,78 6,60" fill="#EAE0CE" stroke="#C9BCA4" stroke-width="1"/>
    <polygon points="78,24 42,42 42,78 78,60" fill="url(#whiteDieSide)" stroke="#B8AA90" stroke-width="1"/>
    <!-- Top face pips (5) -->
    <ellipse cx="42" cy="24" rx="4.2" ry="2.4" fill="#08172F"/>
    <ellipse cx="26" cy="24" rx="3.8" ry="2.1" fill="#08172F"/>
    <ellipse cx="58" cy="24" rx="3.8" ry="2.1" fill="#08172F"/>
    <ellipse cx="42" cy="15" rx="3.8" ry="2.1" fill="#08172F"/>
    <ellipse cx="42" cy="33" rx="3.8" ry="2.1" fill="#08172F"/>
    <!-- Left face pips (3) -->
    <circle cx="17" cy="39" r="3.2" fill="#08172F"/>
    <circle cx="24" cy="49" r="3.2" fill="#08172F"/>
    <circle cx="31" cy="59" r="3.2" fill="#08172F"/>
    <!-- Right face pips (2) -->
    <circle cx="53" cy="59" r="3.2" fill="#08172F"/>
    <circle cx="67" cy="41" r="3.2" fill="#08172F"/>
