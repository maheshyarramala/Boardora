<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <radialGradient id="stageGlow" cx="55%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#D6AD55" stop-opacity="0.24"/>
      <stop offset="65%" stop-color="#2865C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08172F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="walnutDeck" x1="80" y1="210" x2="560" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B3A29"/>
      <stop offset="50%" stop-color="#3F261A"/>
      <stop offset="100%" stop-color="#27160E"/>
    </linearGradient>
    <linearGradient id="goldPiece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0BC"/>
      <stop offset="45%" stop-color="#D6AD55"/>
      <stop offset="100%" stop-color="#9B712D"/>
    </linearGradient>
    <linearGradient id="whiteDieTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EBDD"/>
    </linearGradient>
    <linearGradient id="whiteDieSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6DCCB"/>
      <stop offset="100%" stop-color="#C8BAA2"/>
    </linearGradient>
    <radialGradient id="redPawn" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#F99797"/>
      <stop offset="45%" stop-color="#D94343"/>
      <stop offset="100%" stop-color="#7B1E1E"/>
