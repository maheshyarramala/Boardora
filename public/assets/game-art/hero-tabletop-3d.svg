    </radialGradient>
    <radialGradient id="goldPawn" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#FFF0BC"/>
      <stop offset="45%" stop-color="#D6AD55"/>
      <stop offset="100%" stop-color="#7D581B"/>
    </radialGradient>
